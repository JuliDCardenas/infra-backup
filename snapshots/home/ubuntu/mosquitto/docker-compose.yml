<65;46;28M<65;46;28Mservices:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - /opt/mosquitto/config:/mosquitto/config:ro
      - /opt/mosquitto/data:/mosquitto/data
      - /opt/mosquitto/log:/mosquitto/log
      - /opt/mosquitto/secrets:/mosquitto/secrets:ro
      - /opt/mosquitto/certs:/mosquitto/certs:ro
    networks:
      - mqtt_net

  mqtt-postgres:
    ## image: postgres:16      ## Solo BD Postgres sin timescaleDB
    image: timescale/timescaledb:latest-pg16    ## Postgres 16 con timescaledb
    container_name: mqtt-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-America/Bogota}
    command: >
        postgres -c shared_preload_libraries=timescaledb
    volumes:
      - mqtt_pg_data:/var/lib/postgresql/data
    # No expongas puertos a la máquina host (más seguro)
    # ports:
    #   - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mqtt_net
      - redinterna

  adminer:
    image: adminer:4
    container_name: mqtt-adminer
    restart: unless-stopped
    environment:
      # Opcional: fija el server por defecto en la UI
      ADMINER_DEFAULT_SERVER: mqtt-postgres
    ports:
      # Publica Adminer SOLO en localhost; Caddy (en el host) hace reverse_proxy a localhost:8081
      - "127.0.0.1:8084:8080"
    depends_on:
      - mqtt-postgres
    networks:
      - mqtt_net

  mqtt-subscriber:
    build: ./subscriber01
    container_name: mqtt-subscriber
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # MQTT
      MQTT_HOST: mqtt.julidcardenas.site
      MQTT_PORT: 8883
      MQTT_USER: ${MQTT_USER:-julian}
      MQTT_PASS: ${MQTT_PASS}
      MQTT_TOPIC: tracker/KZX003/imu/tilt
      MQTT_TLS_INSECURE: "true"
  
      # Postgres (conexión por red docker)
      PGHOST: mqtt-postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
  
      DEVICE_ID: KZX003
    depends_on:
      - mqtt-postgres
    networks:
      - mqtt_net


  subscriber-json-osmand:
    build: ./subscriberJsonOsmAnd
    container_name: subscriber-json-osmand
    restart: unless-stopped
    environment:
      MQTT_HOST: "mqtt.julidcardenas.site"
      MQTT_PORT: "1883"
      MQTT_USER: "julian"
      MQTT_PASS: ${MQTT_PASS}
      MQTT_TOPIC: "tracker/Lilygo/telemetria"

      TRACCAR_HOST: "traccar.julidcardenas.site"
      TRACCAR_PORT: "5055"
      TRACCAR_DEVICE_ID: "Lilygo"

      MIN_INTERVAL_SEC: "10"
      MIN_MOVE_METERS: "20"
      LOG_LEVEL: "INFO"



volumes:
  mqtt_pg_data:

networks:
  mqtt_net:
    driver: bridge
  redinterna:
    external: true
